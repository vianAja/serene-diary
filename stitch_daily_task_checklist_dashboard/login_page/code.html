<style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #F1F0E8;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-shadow {
            box-shadow: 0px 4px 12px rgba(137, 168, 178, 0.08);
        }
        .input-underline {
            border-bottom: 2px solid #E5E1DA;
            transition: border-color 0.3s ease;
        }
        .input-underline:focus {
            border-bottom-color: #45636c;
            outline: none;
        }
        .bg-mesh {
            background-color: #f1f0e8;
            background-image: 
                radial-gradient(at 0% 0%, rgba(137, 168, 178, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(179, 200, 207, 0.2) 0px, transparent 50%);
        }

<body class="bg-mesh min-h-screen flex items-center justify-center p-margin-mobile md:p-lg">
<div class="w-full max-w-[440px] flex flex-col items-center">
<!-- Brand Header -->
<div class="mb-xl text-center">
<div class="flex items-center justify-center gap-sm mb-xs">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
<span class="font-headline-md text-headline-md font-extrabold text-primary tracking-tight">SereneDiary</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Stay mindful today</p>
</div>
<!-- Login Card -->
<main class="w-full bg-surface-container-lowest rounded-xl p-lg md:p-xl soft-shadow border border-surface-variant/50">
<header class="mb-xl">
<h1 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Selamat datang kembali</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Lanjutkan perjalanan refleksi diri Anda hari ini.</p>
</header>
<form action="#" class="space-y-lg">
<!-- Social Login -->
<button class="w-full flex items-center justify-center gap-md py-md px-lg border border-outline-variant bg-white rounded-lg font-body-md text-body-md text-on-surface hover:bg-surface-container-low transition-colors duration-200" type="button">
<svg height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>

</svg>
<span>Masuk dengan Google</span>
</button>
<div class="relative flex items-center justify-center">
<hr class="w-full border-outline-variant"/>
<span class="absolute bg-surface-container-lowest px-md font-label-md text-label-md text-outline">ATAU</span>
</div>
<!-- Credentials -->
<div class="space-y-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-primary" for="email">Email</label>
<input class="font-body-md text-body-md py-sm bg-transparent input-underline placeholder:text-outline-variant" id="email" placeholder="nama@email.com" type="email"/>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-primary" for="password">Kata Sandi</label>
<a class="font-label-md text-label-md text-primary-container hover:underline" href="#">Lupa Password?</a>
</div>
<input class="font-body-md text-body-md py-sm bg-transparent input-underline placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-md rounded-lg hover:shadow-lg transition-all duration-300 transform active:scale-[0.98]" type="submit">
                    Masuk
                </button>
</form>
<footer class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Belum punya akun? 
                    <a class="text-primary font-bold hover:underline" href="#">Daftar Akun Baru</a>
</p>
</footer>
